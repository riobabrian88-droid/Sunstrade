<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Sunraku Trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <line x1="6" y1="2" x2="6" y2="20" stroke="#c2483d" stroke-width="1.4"/>
      <rect x="3.2" y="7" width="5.6" height="8" fill="#c2483d"/>
      <line x1="16" y1="4" x2="16" y2="18" stroke="#3e7d8c" stroke-width="1.4"/>
      <rect x="13.2" y="9" width="5.6" height="6" fill="#3e7d8c"/>
    </svg>
    Sunraku Trade
  </a>
  <div class="nav-actions">
    <a class="btn" href="signup.html">Create account</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="card">
    <h2>Sign in</h2>
    <form id="loginForm" novalidate>
      <p>Welcome back. Enter your details to continue.</p>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <span class="field-error" id="email-error" role="alert"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-pressed="false">Show</button>
        </div>
        <span class="field-error" id="password-error" role="alert"></span>
      </div>

      <button class="btn" type="submit">Sign in</button>
    </form>
    <div class="auth-page-link">New to Sunraku? <a href="signup.html">Create an account</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/login.js"></script>
</body>
</html>
